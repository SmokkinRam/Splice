# Words the speech model often mishears -> what you meant (single words only).
# Add to this list whenever the assistant mishears you.
aliases:
  crows: chrome
  throat: chrome
  crome: chrome
  dems: dbms
  dimms: dbms
  dbs: dbms  


# Spoken app name -> the name as it appears in the Start menu.
app_aliases:
  browser: Google Chrome
  vs code: Visual Studio Code 
  Anti: Antigravity IDE

# Chrome profiles: spoken name -> the profile's folder, as shown by
#   python -m assistant.tools.chrome
chrome_profiles:
  my: DEFULT
  mom: Default1 
# Your own spoken folder names -> real paths. "open splice" opens the folder.
# Use forward slashes. Add your own, for example your college folders.
folders:
  splice: D:/Splice/Splice
  screenshots: C:/Users/ADMIN/Pictures/Screenshots

# Where screenshots are saved.
screenshot_folder: C:/Users/ADMIN/Pictures/Screenshots
# Extra places to look for apps that are NOT in the Start menu (portable apps, etc.).
app_search_folders:
  - "C:/Program Files"